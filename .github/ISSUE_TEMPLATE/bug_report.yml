name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: When I try to start the control plane, it crashes with...
    validations:
      required: true
  
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `docker compose up --build`
        2. Wait for 10 seconds
        3. Check dashboard at localhost:8085
        4. See error
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The dashboard should show all 3 nodes with their metrics
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Dashboard shows "No nodes registered" error
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant log output
      render: shell
  
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version are you running?
      options:
        - v0.0.1 (Phase-1)
        - Latest main branch
        - Other (specify in description)
    validations:
      required: true
  
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you've done the following
      options:
        - label: I have read the README.md
        - label: I have checked existing issues
        - label: I have Docker Desktop running
        - label: I have Java 21 installed
        - label: I have Python 3.11 installed
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem
