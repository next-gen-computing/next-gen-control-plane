name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and test Java components
  build-java:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: |
        cd java-control-plane
        mvn clean package -DskipTests
    
    - name: Run tests
      run: |
        cd java-control-plane
        mvn test
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: java-control-plane/target/site/jacoco/

  # Build Python predictor
  build-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd python-predictor
        pip install -r requirements.txt
    
    - name: Generate gRPC stubs
      run: |
        pip install grpcio-tools
        python -m grpc_tools.protoc \
          -I proto \
          --python_out=python-predictor \
          --grpc_python_out=python-predictor \
          proto/control_plane.proto

  # Integration test
  integration-test:
    runs-on: ubuntu-latest
    needs: [build-java, build-python]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install grpcio grpcio-tools protobuf
    
    - name: Start services
      run: |
        docker compose up --build -d
        sleep 20
    
    - name: Run integration tests
      run: |
        python scripts/integration-test.py
    
    - name: Cleanup
      if: always()
      run: docker compose down

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Java formatting
      run: |
        cd java-control-plane
        # Add spotless or checkstyle here when configured
        echo "Code formatting check placeholder"
