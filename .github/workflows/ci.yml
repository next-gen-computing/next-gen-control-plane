name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and test the java-control-plane module. desktop-ui and cli both depend on this module's
  # jar (see their own pom.xml <dependency> on com.nextgen:control-plane) so it must be `install`ed
  # to the local Maven repo, not just `package`d, before either downstream module can resolve it.
  build-java:
    runs-on: ubuntu-latest
    # Defense in depth alongside Surefire's own forkedProcessTimeoutInSeconds (java-control-plane/pom.xml):
    # this catches a hang anywhere in the job, including before Surefire itself even starts (dependency
    # resolution, image builds). GitHub Actions' own default is 360 minutes — a real, confirmed problem
    # (see build-desktop-and-cli below) that let a hung job run silently for hours instead of failing fast.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install parent POM
      run: mvn install -N -q

    - name: Build and install java-control-plane
      run: |
        cd java-control-plane
        mvn clean install -DskipTests

    - name: Run tests
      run: |
        cd java-control-plane
        mvn test

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-java-control-plane
        path: java-control-plane/target/site/jacoco/

  # Build and test desktop-ui and cli, both of which depend on java-control-plane's installed jar.
  # Previously this project had no CI coverage at all for these two modules — desktop-ui's real test
  # suite (207 tests) never needs a display: JavaFX view/Application/Scene classes are deliberately
  # untested here (see CHANGELOG's JaCoCo entry) precisely because they need a running toolkit and a
  # display that a headless GitHub Actions runner doesn't have; everything actually under test
  # (services, DTOs, HTTP handlers, business logic) does not touch JavaFX at all.
  build-desktop-and-cli:
    runs-on: ubuntu-latest
    needs: build-java
    # Confirmed live: this job's desktop-ui step hung for hours (repeatedly starting fresh LocalUiServer
    # instances with no progress) against GitHub Actions' 360-minute default job timeout, before Surefire
    # gained its own forkedProcessTimeoutInSeconds bound. Both bounds now stay in place together.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install parent POM and java-control-plane
      run: |
        mvn install -N -q
        cd java-control-plane
        mvn clean install -DskipTests -q

    - name: Build and test desktop-ui
      run: |
        cd desktop-ui
        mvn clean test

    - name: Build and test cli
      run: |
        cd cli
        mvn clean test

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-desktop-ui
        path: desktop-ui/target/site/jacoco/

  # Build Python predictor
  build-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd python-predictor
        # torch (Stage I) first, from its CPU-only wheel index — mirrors python-predictor/Dockerfile
        # exactly. The default PyPI index resolves plain `torch` to a much larger CUDA-bundled build
        # that's irrelevant (and slow/flaky) on a CI runner with no GPU; see requirements.txt's own
        # Stage I comment. The version here must stay in sync with requirements.txt's torch== pin.
        pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Generate gRPC stubs
      run: |
        pip install grpcio-tools
        python -m grpc_tools.protoc \
          -I proto \
          --python_out=python-predictor \
          --grpc_python_out=python-predictor \
          proto/control_plane.proto

    - name: Run predictor unit tests
      run: |
        cd python-predictor
        pip install pytest
        pytest tests/ -v

  # Integration test
  integration-test:
    runs-on: ubuntu-latest
    needs: [build-java, build-python]
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install grpcio grpcio-tools protobuf
    
    - name: Start services
      run: |
        docker compose up --build -d
        sleep 20
    
    - name: Run integration tests
      run: |
        python scripts/integration-test.py
    
    - name: Cleanup
      if: always()
      run: docker compose down

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Java formatting
      run: |
        cd java-control-plane
        # Add spotless or checkstyle here when configured
        echo "Code formatting check placeholder"
