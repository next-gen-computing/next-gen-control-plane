name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Create GitHub Release
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this Release
          
          See [CHANGELOG.md](CHANGELOG.md) for full details.
          
          ## Installation
          
          ```bash
          docker compose up --build
          ```
          
          ## Quick Start
          
          1. Start services: `docker compose up -d`
          2. Open dashboard: http://localhost:8085
          3. Run tests: `python scripts/integration-test.py`
        draft: false
        prerelease: false

  # Build and publish Docker images
  build-and-push:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Control Plane
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./java-control-plane/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/nextgen-control-plane:${{ github.ref_name }}
          ${{ secrets.DOCKER_USERNAME }}/nextgen-control-plane:latest
    
    - name: Build and push Predictor
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./python-predictor/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/nextgen-predictor:${{ github.ref_name }}
          ${{ secrets.DOCKER_USERNAME }}/nextgen-predictor:latest
    
    - name: Build and push Dashboard
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dashboard/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/nextgen-dashboard:${{ github.ref_name }}
          ${{ secrets.DOCKER_USERNAME }}/nextgen-dashboard:latest
