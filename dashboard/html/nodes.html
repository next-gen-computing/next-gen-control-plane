<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Next-Gen Control Plane — Nodes Dashboard">

    <title>Nodes — Task Manager</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">

</head>



<body>

    <header class="titlebar">

        <div class="titlebar-left">

            <div class="titlebar-logo">⚡</div>

            <h1>Next-Gen Control Plane <span>— Task Manager</span></h1>

        </div>

        <div class="status-badge" id="connectionStatus">

            <span class="dot"></span>

            <span>Connected</span>

        </div>

    </header>



    <nav class="tabs">

        <a href="overview.html" class="tab">Overview</a>

        <a href="performance.html" class="tab">Performance</a>

        <a href="nodes.html" class="tab active">Nodes</a>

    </nav>



    <main class="main-content">

        <section class="tab-panel active">

            <div class="section-title">All Registered Nodes</div>

            <div class="nodes-table-container">

                <table class="nodes-table">

                    <thead>

                        <tr>

                            <th>Node ID</th>

                            <th>IP Address</th>

                            <th>Hostname</th>

                            <th>Port</th>

                            <th>CPU Usage</th>

                            <th>Memory Usage</th>

                            <th>Status</th>

                            <th>Last Heartbeat</th>

                        </tr>

                    </thead>

                    <tbody id="processes-nodes-body">

                        <tr><td colspan="8" class="empty-state"><p>Waiting for nodes to register...</p></td></tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>



    <footer class="footer">

        <div class="refresh-info"><span class="refresh-dot"></span><span>Live — 2s</span></div>

        <div id="last-update">Last update: —</div>

    </footer>

    <script src="../js/app.js"></script>

</body>



</html>
