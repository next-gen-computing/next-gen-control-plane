syntax = "proto3";
package nextgen.v1;

service ControlPlane {
  rpc RegisterNode (NodeInfo) returns (RegisterResponse);
  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc SubmitTask (TaskRequest) returns (TaskResponse);
  rpc GetNodes (Empty) returns (NodeList);
}

message NodeInfo {
  string node_id = 1;
  string ip = 2;
  int32 port = 3;
  string hostname = 4;
}

message RegisterResponse { string status = 1; string assigned_id = 2; }
message HeartbeatRequest { string node_id = 1; float cpu = 2; float memory = 3; }
message HeartbeatResponse { string status = 1; }
message TaskRequest { string task_id = 1; string payload = 2; }
message TaskResponse { string result = 1; }
message Empty {}
message NodeList { repeated NodeInfo nodes = 1; }