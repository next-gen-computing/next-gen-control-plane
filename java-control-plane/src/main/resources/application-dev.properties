# =============================================================================
# application-dev.properties — Spring Boot dev / CI profile
#
# Activates with: -Dspring.profiles.active=dev
# Uses H2 in-memory database so no Postgres installation is required.
# =============================================================================

# H2 in-memory — wiped on restart, perfect for development / CI
spring.datasource.url=jdbc:h2:mem:nextgendb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console (browse http://localhost:8080/h2-console in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway must know the non-Postgres vendor for H2
spring.flyway.locations=classpath:db/migration

# No Postgres dialect needed
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.flywaydb=DEBUG
