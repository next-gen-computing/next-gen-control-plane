# =============================================================================
# Next-Gen Control Plane — Spring Boot configuration
#
# Profiles:
#   (default) — connects to PostgreSQL; use in production/local with Docker
#   dev       — uses H2 in-memory (no Postgres required); activate with -Dspring.profiles.active=dev
# =============================================================================

# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=next-gen-control-plane

# ── Embedded server (Spring MVC REST API) ────────────────────────────────────
# Runs alongside the gRPC server. gRPC uses port 50051 (env GRPC_PORT).
# Spring REST API runs on 8080 (separate from the legacy dashboard on 8085).
server.port=8080
server.servlet.context-path=/

# ── Database (H2 in-memory default; PostgreSQL in full-stack/production) ───────
# Default: in-memory H2 so the control plane boots with zero external dependencies.
# When running with PostgreSQL (e.g. docker-compose.full-stack.yml or production),
# set SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/nextgen
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:nextgendb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP connection pool
spring.datasource.hikari.pool-name=NextGenPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── Flyway migrations ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Logging ───────────────────────────────────────────────────────────────────
# Keep Spring's own framework logging minimal; application logs use slf4j-simple
logging.level.org.springframework=WARN
logging.level.org.flywaydb=INFO
logging.level.com.nextgen=INFO

# ── WebSocket ─────────────────────────────────────────────────────────────────
# STOMP endpoint registered in WebSocketConfig.java
# Clients connect at ws://localhost:8080/ws

# ── Actuator (minimal — health + info only) ───────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
